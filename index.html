<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; media-src 'none'; object-src 'none';" />
    <title>iFlow 设置编辑器</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f3f3;
        transition: opacity 0.4s ease;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      #splash-title {
        font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
        font-size: 20px;
        font-weight: 600;
        color: #1a1a1a;
        letter-spacing: 0.5px;
        opacity: 0;
        animation: splashIn 0.35s ease forwards 0.15s;
      }
      #splash-spinner {
        margin-top: 8px;
        width: 24px;
        height: 24px;
        border: 2.5px solid #e0e0e0;
        border-top-color: #0078d4;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        opacity: 0;
        animation:
          splashIn 0.35s ease forwards 0.25s,
          spin 0.8s linear infinite 0.25s;
      }
      @keyframes splashIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-inner">
        <div id="splash-title">iFlow</div>
        <div id="splash-spinner"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
