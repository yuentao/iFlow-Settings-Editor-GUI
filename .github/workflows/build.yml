name: Build

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - main
      - release
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PR 检验：lint + type-check + test ──
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test with coverage
        run: npm run test:coverage

  # ── 自动打 Tag（仅 release 分支 push）──
  create-tag:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from changelog
        id: version
        run: |
          VERSION=$(awk -F'[][]' '/^## \[.*\]/ {print $2; exit}' CHANGELOG.md)
          if [ -z "$VERSION" ]; then
            echo "无法从 CHANGELOG.md 提取版本号"
            exit 1
          fi
          echo "提取到版本: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          TAG_NAME="v${{ steps.version.outputs.version }}"
          echo "创建 tag: $TAG_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

  build-mac:
    needs: create-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            script: mac64
          - arch: arm64
            script: mac-arm

    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build & Package macOS
        run: npm run build:${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload zip artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-zip-${{ matrix.arch }}
          path: |
            release/*-${{ matrix.arch }}.zip
            release/*-${{ matrix.arch }}*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

      - name: Upload dmg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-${{ matrix.arch }}
          path: release/*-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30

  build-windows:
    needs: create-tag
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build & Package Windows
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/*.yml
          retention-days: 30

  release:
    needs: [create-tag, build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: false

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Prepare changelog
        id: changelog
        run: |
          CHANGELOG_FILE="CHANGELOG.md"
          VERSION="${{ needs.create-tag.outputs.version }}"
          TAG_VERSION="v${VERSION}"

          CHANGELOG_CONTENT=$(awk -v version="$VERSION" '
            BEGIN { found=0 }
            found == 0 && /^## \[.*\]/ && index($0, "[" version "]") > 0 { found=1; next }
            found && /^## \[.*\]/ { found=0; exit }
            found { print }
          ' "$CHANGELOG_FILE")

          if [ -z "$CHANGELOG_CONTENT" ]; then
            echo "body=${TAG_VERSION} 更新内容" >> $GITHUB_OUTPUT
          else
            BODY=$(printf '%s' "$CHANGELOG_CONTENT")
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "$BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

          echo "版本: $TAG_VERSION"
          echo "更新日志:"
          echo "$CHANGELOG_CONTENT"

      - name: Collect and validate release files
        run: |
          mkdir -p release-files
          cp artifacts/windows-artifacts/*.exe release-files/ 2>/dev/null || true
          cp artifacts/windows-artifacts/*.zip release-files/ 2>/dev/null || true
          cp artifacts/windows-artifacts/*.blockmap release-files/ 2>/dev/null || true
          cp artifacts/windows-artifacts/*.yml release-files/ 2>/dev/null || true
          cp artifacts/mac-zip-*/*.zip release-files/ 2>/dev/null || true
          cp artifacts/mac-dmg-*/*.dmg release-files/ 2>/dev/null || true
          cp artifacts/mac-zip-*/*.blockmap release-files/ 2>/dev/null || true

          for arch in x64 arm64; do
            if [ ! -f "artifacts/mac-zip-${arch}/latest-mac.yml" ]; then
              echo "缺少 macOS ${arch} 自动更新元数据 latest-mac.yml"
              exit 1
            fi
            if ! ls release-files/*-${arch}.zip >/dev/null 2>&1; then
              echo "缺少 macOS ${arch} zip 更新包"
              exit 1
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          metadata_files = [Path('artifacts/mac-zip-x64/latest-mac.yml'), Path('artifacts/mac-zip-arm64/latest-mac.yml')]
          entries = []
          common = {}
          seen_arches = set()

          for metadata_file in metadata_files:
              text = metadata_file.read_text(encoding='utf-8')
              if not re.search(r'^files:\n\s*-\s+url:', text, re.MULTILINE):
                  print(f'{metadata_file} 缺少有效 files 条目')
                  sys.exit(1)

              current = None
              for line in text.splitlines():
                  if line.startswith('version:'):
                      common['version'] = line
                  elif line.startswith('releaseDate:'):
                      common['releaseDate'] = line
                  elif line.startswith('- url:') or line.startswith('  - url:'):
                      if current:
                          entries.append(current)
                      current = [line if line.startswith('  - ') else f'  {line}']
                      if '-x64.zip' in line:
                          seen_arches.add('x64')
                      if '-arm64.zip' in line:
                          seen_arches.add('arm64')
                  elif current and (line.startswith('    ') or line.startswith('  sha') or line.startswith('  size')):
                      current.append(line if line.startswith('    ') else f'  {line}')
              if current:
                  entries.append(current)

          missing_arches = {'x64', 'arm64'} - seen_arches
          if missing_arches:
              print(f'合并后的 latest-mac.yml 缺少架构条目: {", ".join(sorted(missing_arches))}')
              sys.exit(1)

          output = []
          if 'version' in common:
              output.append(common['version'])
          output.append('files:')
          for entry in entries:
              output.extend(entry)
          if 'releaseDate' in common:
              output.append(common['releaseDate'])
          output.append('')

          Path('release-files/latest-mac.yml').write_text('\n'.join(output), encoding='utf-8')
          PY

          grep -q '^files:' release-files/latest-mac.yml
          grep -q '^  - url:.*-x64.zip' release-files/latest-mac.yml
          grep -q '^  - url:.*-arm64.zip' release-files/latest-mac.yml
          ls -la release-files/
          echo "latest-mac.yml:"
          cat release-files/latest-mac.yml

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          replace: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          tag_name: v${{ needs.create-tag.outputs.version }}
          name: v${{ needs.create-tag.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}